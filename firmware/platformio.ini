; ReMow Core firmware - PlatformIO project (scaffold)
; Target: ESP32-S3. Build with `pio run`, flash with `pio run -t upload`.

[platformio]
default_envs = remow_core

[env:remow_core]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DREMOW_CORE
    -DRC_LINK_LOSS_TIMEOUT_MS=500
; lib_deps are placeholders; pin exact versions when implementing.
lib_deps =
